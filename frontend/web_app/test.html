<!DOCTYPE html>
<html>
<head>
    <title>Component Tests</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="styles.css" rel="stylesheet">
</head>
<body class="p-8">
    <h1 class="text-2xl font-bold mb-6">Component Tests</h1>
    
    <div class="space-y-12">
        <section>
            <h2 class="text-xl font-semibold mb-4">Map Component</h2>
            <div id="map-test" class="border rounded-lg p-4"></div>
        </section>
        
        <section>
            <h2 class="text-xl font-semibold mb-4">Booking Component</h2>
            <div id="booking-test" class="border rounded-lg p-4 max-w-md"></div>
        </section>
        
        <section>
            <h2 class="text-xl font-semibold mb-4">Suggestions Component</h2>
            <div id="suggestions-test" class="border rounded-lg p-4 max-w-md"></div>
        </section>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            ReactDOM.render(<MapComponent />, document.getElementById('map-test'));
            ReactDOM.render(<BookingComponent />, document.getElementById('booking-test'));
            ReactDOM.render(<SuggestionsComponent />, document.getElementById('suggestions-test'));
        });
    </script>
</body>
</html>
