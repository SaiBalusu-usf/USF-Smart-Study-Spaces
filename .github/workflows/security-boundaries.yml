name: Local security boundaries
on:
  push:
    branches: [main, fix/security-local-boundaries-20261026]
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python3 -m unittest discover -s tests/frontend_tests -p 'test_dev_server_security.py'
      - run: node --test tests/backend_tests/occupancy_security.test.cjs
